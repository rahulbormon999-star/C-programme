<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C Programming IDE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 h-14 flex items-center justify-between px-3 z-10 shrink-0">
    <div class="flex items-center gap-2">
      <button id="menu-btn" class="p-2 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1 rounded-md border border-slate-700">
        <i class="fa-solid fa-file-code text-blue-400 text-sm"></i>
        <span id="current-filename" class="text-sm font-semibold truncate max-w-[100px] sm:max-w-[150px]">main.c</span>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <button id="rename-btn" class="p-2 text-slate-300 hover:text-amber-400 hover:bg-slate-700 rounded-lg transition" title="Rename File">
        <i class="fa-solid fa-pen-to-square"></i>
      </button>
      <button id="new-file-btn" class="p-2 text-slate-300 hover:text-emerald-400 hover:bg-slate-700 rounded-lg transition" title="New File">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button id="run-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3.5 py-1.5 rounded-lg flex items-center gap-1.5 text-sm shadow-lg shadow-blue-900/40 transition">
        <i class="fa-solid fa-play text-xs"></i> Run
      </button>
    </div>
  </header>

  <!-- Sidebar Overlay & Menu -->
  <div id="drawer-overlay" class="fixed inset-0 bg-slate-950/60 z-20 hidden backdrop-blur-sm transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-slate-800 z-30 transform -translate-x-full transition-transform duration-300 flex flex-col border-r border-slate-700">
    <div class="p-4 border-b border-slate-700 flex items-center justify-between">
      <h2 class="text-base font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-folder-open text-blue-400"></i> Code Files
      </h2>
      <button id="close-drawer" class="text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="file-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      <!-- File items will render here -->
    </div>
  </aside>

  <!-- Main Work Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden">
    
    <!-- Code Editor Container -->
    <div id="editor-container" class="flex-1 flex overflow-hidden bg-slate-950">
      <div id="line-numbers" class="w-10 py-3 pr-2 text-right bg-slate-900 text-slate-600 text-sm font-mono select-none border-r border-slate-800">1</div>
      <textarea id="code-editor" class="flex-1 py-3 px-3 bg-transparent text-emerald-400 font-mono text-sm leading-relaxed resize-none outline-none border-none whitespace-pre overflow-auto" spellcheck="false"></textarea>
    </div>

    <!-- Full Screen Output Container (Hidden by default) -->
    <div id="output-container" class="absolute inset-0 bg-slate-950 z-10 flex flex-col hidden">
      <div class="bg-slate-800 px-4 py-2 border-b border-slate-700 flex justify-between items-center">
        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-terminal text-emerald-400"></i> Execution Output
        </span>
        <button id="back-to-editor-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1 rounded text-white flex items-center gap-1 transition">
          <i class="fa-solid fa-code"></i> Edit Code
        </button>
      </div>
      <pre id="output-terminal" class="flex-1 p-4 font-mono text-sm text-slate-200 overflow-auto whitespace-pre-wrap leading-relaxed"></pre>
    </div>

  </main>

  <script src="index.js"></script>
</body>
</html>
